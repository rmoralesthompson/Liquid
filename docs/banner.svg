<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Liquid — server-driven UI for Go">
  <title>Liquid — server-driven UI for Go</title>
  <defs>
    <!-- Refreshing liquid gradient: sky → cyan → teal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="0.45" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <!-- Top gloss -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Wave fills -->
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <!-- Droplet gradient -->
    <radialGradient id="drop" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#e0fbff"/>
      <stop offset="1" stop-color="#5eead4"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="tshadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#083344" flood-opacity="0.45"/>
    </filter>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="340" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Base -->
    <rect x="0" y="0" width="1200" height="340" fill="url(#bg)"/>

    <!-- Soft floating blobs for depth -->
    <circle cx="140" cy="70" r="90" fill="#ffffff" opacity="0.10" filter="url(#soft)"/>
    <circle cx="1050" cy="250" r="120" fill="#083344" opacity="0.12" filter="url(#soft)"/>
    <circle cx="980" cy="60" r="60" fill="#ffffff" opacity="0.10" filter="url(#soft)"/>

    <!-- Bubbles -->
    <g fill="#ffffff">
      <circle cx="220" cy="250" r="10" opacity="0.35"/>
      <circle cx="260" cy="285" r="6" opacity="0.28"/>
      <circle cx="185" cy="290" r="4" opacity="0.30"/>
      <circle cx="1000" cy="130" r="8" opacity="0.30"/>
      <circle cx="1045" cy="165" r="5" opacity="0.25"/>
      <circle cx="940" cy="120" r="4" opacity="0.28"/>
    </g>

    <!-- Layered liquid waves along the bottom -->
    <path d="M0,236 C160,206 300,266 460,238 C620,210 760,262 920,238 C1040,220 1130,250 1200,236 L1200,340 L0,340 Z"
          fill="url(#wave1)" opacity="0.35"/>
    <path d="M0,262 C170,236 320,290 480,262 C650,232 790,282 950,262 C1060,248 1140,272 1200,262 L1200,340 L0,340 Z"
          fill="url(#wave2)" opacity="0.45"/>
    <path d="M0,292 C180,270 340,314 520,292 C700,270 840,312 1000,294 C1080,285 1150,300 1200,292 L1200,340 L0,340 Z"
          fill="#0f766e" opacity="0.40"/>

    <!-- Droplet mark -->
    <g transform="translate(600,96)">
      <path d="M0,-46 C24,-14 40,4 40,26 A40,40 0 1 1 -40,26 C-40,4 -24,-14 0,-46 Z"
            fill="url(#drop)"/>
      <ellipse cx="-12" cy="22" rx="9" ry="13" fill="#ffffff" opacity="0.65"/>
    </g>

    <!-- Wordmark -->
    <text x="600" y="212" text-anchor="middle" filter="url(#tshadow)"
          font-family="'Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif"
          font-size="104" font-weight="700" letter-spacing="1" fill="#ffffff">Liquid</text>

    <!-- Tagline -->
    <text x="600" y="256" text-anchor="middle"
          font-family="'Segoe UI',Helvetica,Arial,sans-serif"
          font-size="25" font-weight="500" letter-spacing="5" fill="#ecfeff" opacity="0.92">SERVER-DRIVEN UI FOR GO</text>

    <!-- Top gloss overlay -->
    <rect x="0" y="0" width="1200" height="150" fill="url(#gloss)"/>
    <!-- Subtle inner border -->
    <rect x="1" y="1" width="1198" height="338" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  </g>
</svg>
