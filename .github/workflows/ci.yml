name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run golangci-lint
        if: hashFiles('go.mod') != ''
        uses: golangci-lint/golangci-lint-action@v6
        with:
          version: latest
          # Uses the .golangci-lint.yml file in your project root
          args: --timeout=5m

      - name: Skip (no go.mod yet)
        if: hashFiles('go.mod') == ''
        run: echo "No go.mod yet — module path is still an open decision (docs/design-decisions.md §5). Skipping lint until implementation begins."

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Tests
        if: hashFiles('go.mod') != ''
        run: go test -v -race -coverprofile=coverage.txt ./...

      - name: Skip (no go.mod yet)
        if: hashFiles('go.mod') == ''
        run: echo "No go.mod yet — module path is still an open decision (docs/design-decisions.md §5). Skipping tests until implementation begins."
